<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 12px;
        background: #11151d;
        color: #e8edf6;
      }

      h2, h3, h4 { margin: 0 0 10px; }

      .row { margin-bottom: 10px; }

      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .chip {
        border: 1px solid #324158;
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 12px;
      }

      .ready { border-color: #4caf50; }
      .scanning, .capturing, .downloading { border-color: #f5b042; }
      .complete { border-color: #64b5f6; }
      .partial { border-color: #ab47bc; }
      .failed { border-color: #ff5252; }

      button {
        width: 100%;
        margin: 4px 0;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #324158;
        background: #1a2230;
        color: #e8edf6;
      }

      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        margin: 4px 0;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #324158;
        background: #0f141c;
        color: #e8edf6;
      }

      .card {
        background: #0d1219;
        border: 1px solid #2a3547;
        border-radius: 10px;
        padding: 10px;
        margin-top: 10px;
      }

      .muted { color: #9fb0c7; }

      .tree {
        font-size: 13px;
        line-height: 1.45;
      }

      .tree-project {
        margin: 0 0 10px;
        padding: 8px;
        background: #121a25;
        border: 1px solid #2a3547;
        border-radius: 8px;
      }

      .tree-project.changed {
        border-color: #f5b042;
        box-shadow: inset 0 0 0 1px rgba(245,176,66,.25);
      }

      .tree-project.exported {
        border-color: #4caf50;
      }

      .tree-project.ungrouped {
        border-color: #5b6c84;
      }

      .tree-project-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      .group-toggle {
        cursor: pointer;
        user-select: none;
        font-size: 12px;
        color: #9fb0c7;
        min-width: 16px;
      }

      .group-title {
        margin: 0;
        font-size: 13px;
        flex: 1;
        cursor: text;
      }

      .group-title-input {
        flex: 1;
        margin: 0;
        padding: 4px 6px;
        font-size: 13px;
        border-radius: 6px;
        border: 1px solid #475569;
        background: #0b1220;
        color: #e8edf6;
      }

      .group-body.collapsed {
        display: none;
      }

      .tree ul {
        margin: 0;
        padding-left: 18px;
      }

      .tree li {
        margin: 4px 0;
        word-break: break-word;
      }

      .checkbox-row {
        display: flex;
        align-items: start;
        gap: 8px;
      }

      .checkbox-row input[type="checkbox"] {
        margin-top: 2px;
      }

      .small-actions {
        display: flex;
        gap: 6px;
        margin: 6px 0 0;
        flex-wrap: wrap;
      }

      .small-actions button {
        width: auto;
        margin: 0;
        padding: 4px 8px;
        font-size: 12px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .stat {
        background: #121a25;
        border: 1px solid #2a3547;
        border-radius: 8px;
        padding: 8px;
      }

      .label {
        font-size: 11px;
        color: #9fb0c7;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .value {
        font-size: 14px;
        font-weight: 600;
        word-break: break-word;
      }

      .badge {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 6px;
        border-radius: 999px;
        font-size: 11px;
        border: 1px solid #3b556f;
        color: #cfe4ff;
      }

      .badge.exported {
        border-color: #4caf50;
        color: #b8f2c1;
      }

      .badge.manual {
        border-color: #ab47bc;
        color: #efccff;
      }

      .badge.count {
        border-color: #64b5f6;
        color: #d7ebff;
      }

      .badge.changed {
        border-color: #f5b042;
        color: #ffe0a3;
      }

      pre {
        background: #0a0f16;
        border: 1px solid #2a3547;
        padding: 8px;
        border-radius: 8px;
        white-space: pre-wrap;
        max-height: 220px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h2>Project Archivist</h2>

    <div class="row chips">
      <span class="chip ready" id="eligibility">ready</span>
      <span class="chip" id="permission">permission: unknown</span>
      <span class="chip" id="captureState">idle</span>
    </div>

    <button id="requestPerm">Request ChatGPT permission</button>
    <button id="scanStandalone">Scan standalone chats</button>
    <button id="scanProject">Scan current project</button>
    <button id="exportSelectedGroups">Export selected groups</button>
    <button id="exportSelectedChats">Export selected chats</button>
    <button id="recaptureSelectedChats">Re-capture selected chats</button>

    <div class="card">
      <h3>Manual grouping</h3>
      <input id="manualGroupName" type="text" placeholder="Enter project/group name for selected chats" />
      <div class="small-actions">
        <button id="applyManualGroup">Apply group to selected chats</button>
        <button id="clearManualGroup">Clear manual group from selected chats</button>
      </div>
      <div class="muted" id="manualGroupStatus">No manual grouping changes yet.</div>
    </div>

    <div class="card">
      <h3>Scanned Structure</h3>
      <div id="structureSummary" class="muted">No scan yet.</div>
      <div class="small-actions">
        <button id="checkAllVisible">Check all</button>
        <button id="uncheckAllVisible">Uncheck all</button>
        <button id="expandAllGroups">Expand all</button>
        <button id="collapseAllGroups">Collapse all</button>
      </div>
      <div id="structureTree" class="tree"></div>
    </div>

    <div class="card">
      <h3>Progress</h3>
      <div class="stats">
        <div class="stat">
          <div class="label">Phase</div>
          <div class="value" id="progressPhase">-</div>
        </div>
        <div class="stat">
          <div class="label">Chats Total</div>
          <div class="value" id="progressTotal">0</div>
        </div>
        <div class="stat">
          <div class="label">Completed</div>
          <div class="value" id="progressCompleted">0</div>
        </div>
        <div class="stat">
          <div class="label">Failed</div>
          <div class="value" id="progressFailed">0</div>
        </div>
        <div class="stat" style="grid-column: 1 / -1;">
          <div class="label">Current Chat</div>
          <div class="value" id="progressCurrentChat">-</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Recent Log</h3>
      <pre id="progressLog">No activity yet.</pre>
    </div>

    <div class="card">
      <h3>Errors</h3>
      <pre id="errorsPanel">No errors.</pre>
    </div>

    <div class="card">
      <h3>Raw Result</h3>
      <pre id="result">No scan yet.</pre>
    </div>

    <script type="module" src="src/sidepanel.js"></script>
  </body>
</html>
